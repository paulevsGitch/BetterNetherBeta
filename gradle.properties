# Done to increase the memory available to gradle.
org.gradle.jvmargs = -Xmx4G

# Fabric Properties
# check these on https://fabricmc.net/use
minecraft_version = b1.7.3
loader_version = 0.19.3
mappings = 0.1.1

# Mod Properties
mod_version = 1.0.0-alpha-10
maven_group = paulevs.bnb
archives_base_name = bnb

# Dependencies
stapi_version = 2.0.0-alpha.6.2
bhcreative_version = 0.4.9
vbe_version = 0.2.19
materialexcavator_version=0.3.0
retrocommands_version = 0.5.4
alwaysmoreitems_version = 1.8.3
glass_networking_version=1.0.6
gcapi_version=3.2.5

# Set connection and socket timeout to 5 minutes (in milliseconds)
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=300000

# Increase maximum download retries and adjust backoff timings
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=500