//file:noinspection GroovyAssignabilityCheck
//file:noinspection GroovyAccessibility
//file:noinspection GrUnresolvedAccess
//file:noinspection GrDeprecatedAPIUsage
//file:noinspection GroovyUnusedAssignment
//file:noinspection ForeignDelegate

plugins {
	id "fabric-loom" version "1.8.12"
	id "babric-loom-extension" version "1.8.9"
	id "maven-publish"
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

babric { disableM1Fixes.set(true) }

loom {
	mixin {
		useLegacyMixinAp = true
	}
	customMinecraftManifest.set("https://babric.github.io/manifest-polyfill/${minecraft_version}.json")
	intermediaryUrl.set("https://maven.glass-launcher.net/babric/babric/intermediary/%1\$s/intermediary-%1\$s-v2.jar")
}

repositories {
	maven {
		name = "Babric"
		url = "https://maven.glass-launcher.net/babric"
	}
	maven {
		name = "Glass Releases"
		url = "https://maven.glass-launcher.net/releases"
	}
	maven {
		name = "Glass Snapshots"
		url = "https://maven.glass-launcher.net/snapshots"
	}
	maven {
		name = "Froge"
		url "https://maven.minecraftforge.net/"
	}
	maven {
		name = "Jitpack"
		url = "https://jitpack.io"
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "com.github.paulevsGitch:BIN-Mappings-BH:${project.mappings}"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "org.apache.logging.log4j:log4j-slf4j18-impl:2.17.2"

	modImplementation ("net.modificationstation:StationAPI:${project.stapi_version}")
	
	modImplementation("com.github.paulevsGitch:BHCreative:${project.bhcreative_version}") {
		transitive false
	}
	
	modImplementation("com.github.paulevsGitch:VanillaBlockEnhancements:${project.vbe_version}") {
		transitive false
	}

	modImplementation("com.github.matthewperiut:retrocommands:${project.retrocommands_version}") {
		transitive false
	}

	// Always More Items dependencies
	implementation(include("me.carleslc:Simple-Yaml:1.8.4") as Dependency)
	modImplementation("net.glasslauncher.mods:glass-networking:${project.glass_networking_version}") {
		transitive false
	}
	modImplementation("net.glasslauncher.mods:GlassConfigAPI:${project.gcapi_version}") {
		transitive false
	}
	modImplementation("net.glasslauncher.mods:AlwaysMoreItems:${project.alwaysmoreitems_version}") {
		transitive false
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_BNB"}
	}
	from("TEXTURES_LICENSE") {
		rename { "${it}_BNB"}
	}
	from("MUSIC_LICENSE") {
		rename { "${it}_BNB"}
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
	repositories {}
}